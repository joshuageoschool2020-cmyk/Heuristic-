<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heuristic_Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap'); body { font-family: 'JetBrains Mono', monospace; }</style>
</head>
<body class="bg-black text-gray-300 min-h-screen">
    <div class="p-8 max-w-6xl mx-auto">
        <header class="mb-12">
            <h1 class="text-3xl font-bold text-white">heuristic_</h1>
            <p class="text-blue-500 text-sm uppercase tracking-widest mt-1">System Operational</p>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-zinc-950 p-6 rounded-xl border border-zinc-800 shadow-2xl">
                <textarea id="userInput" class="w-full h-64 bg-transparent outline-none text-white resize-none" placeholder="Input complex concept..."></textarea>
                <button onclick="analyze()" id="btn" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-md transition-all uppercase tracking-wider text-sm">Initialize_Analysis</button>
            </div>
            <div id="result" class="bg-zinc-950 p-6 rounded-xl border border-zinc-800 font-mono text-sm leading-relaxed overflow-y-auto h-80">
                <span class="text-zinc-600">// Output will be rendered here...</span>
            </div>
        </div>
    </div>
    <script>
        async function analyze() {
            const input = document.getElementById('userInput').value;
            const resDiv = document.getElementById('result');
            if (!input.trim()) return;
            resDiv.innerHTML = '<span class="text-blue-500">// INITIALIZING_PROCESS...</span>';
            const response = await fetch('/explain', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text: input })
            });
            const data = await response.json();
            resDiv.innerHTML = `<span class="text-green-500">// ANALYSIS_COMPLETE</span><br><br><span class="text-white">${data.result.replace(/\n/g, '<br>')}</span>`;
        }
    </script>
</body>
</html>
